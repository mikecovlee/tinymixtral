[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinymixtral"
version = "3.0.0"
description = "TinyMixtral: small open MoE causal language models (model code, training, export, eval tooling)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Lee (李登淳)" }]
dependencies = [
    "torch>=2.0",
    "transformers>=4.50",
    "datasets>=3.0",
    "sentencepiece>=0.2",
    "tokenizers>=0.15",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "zstandard>=0.22",
    "numpy>=1.24",
    "pyarrow>=14",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
    "ruff>=0.6",
]
eval = [
    "lm-eval>=0.4.12",
]

[tool.setuptools.packages.find]
include = ["model*", "hf*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["shared_expert", "tools", ".omo", ".codegraph"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
