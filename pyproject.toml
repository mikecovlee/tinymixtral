[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 128

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 128
max-complexity = 15
ignore = ["E203", "W503", "E722"]
